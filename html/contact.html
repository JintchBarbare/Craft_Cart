<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact · CraftCart</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>


<body>
    <header>
        <nav>
            <ul>
                <li><a href="../index.html">Home</a></li>
                <li><a href="../index.html#about">About</a></li>
                <li><a href="../index.html#featured">Featured Products</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
        <div class="logo">CraftCart</div>
    </header>
    
    <main id="contact">
        <form class="inquiry-form" method="post">
            <div>
                <label for="user-name">სახელი</label>
                <input type="text" id="user-name" placeholder="თქვენი სახელი" required>
            </div>
            
            <div>
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="თქვენი Email" required>
            </div>
            
            
            <label for="inquiry-type">სასურველი თემა</label>
            <select id="inquiry-type" name="topic" required>
                <option value="" disabled selected>აირჩიეთ თემა...</option>
                <option value="Reservation">დაჯავშნა</option>
                <option value="shopping">ყიდვა</option>
                <option value="Delivery">მიწოდება</option>
            </select>
            
            <label for="massage-text">თქვენი შეტყობინება</label>
            <textarea id="massage-text" name="Massage" rows="10"></textarea>
            
            <button type="submit" class="btn-submit">გაგზავნა</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 CraftCart. </p>
    </footer>

    <input type="checkbox" id="theme-toggle-checkbox">
    <label for="theme-toggle-checkbox" class="theme-toggle-btn" aria-label="თემის შეცვლა">
        <span class="icon-moon">
            <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24">
                <path d="M0 0h24v24H0z" fill="none" />
                <path fill="#040470" d="M12 1.992a10 10 0 1 0 9.236 13.838c.341-.82-.476-1.644-1.298-1.31a6.5 6.5 0 0 1-6.864-10.787l.077-.08c.551-.63.113-1.653-.758-1.653h-.266l-.068-.006z" />
            </svg>
        </span>
        <span class="icon-sun">
            <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24">
                <path d="M0 0h24v24H0z" fill="none" />
                <path fill="#ff0" d="M12 19a1 1 0 0 0-1 1v1a1 1 0 1 0 2 0v-1a1 1 0 0 0-1-1m6.364-2.05a1 1 0 1 0-1.414 1.414l.707.707a1 1 0 0 0 1.414-1.414zm-11.314 0a1 1 0 0 0-1.414 0l-.707.707a1 1 0 0 0 1.414 1.414l.707-.707a1 1 0 0 0 0-1.414M12 6a6 6 0 1 0 0 12a6 6 0 0 0 0-12m8 5a1 1 0 1 0 0 2h1a1 1 0 1 0 0-2zM3 11a1 1 0 1 0 0 2h1a1 1 0 1 0 0-2zm16.071-6.071a1 1 0 0 0-1.414 0l-.707.707a1 1 0 1 0 1.414 1.414l.707-.707a1 1 0 0 0 0-1.414m-12.728 0a1 1 0 0 0-1.414 1.414l.707.707A1 1 0 1 0 7.05 5.636zM12 2a1 1 0 0 0-1 1v1a1 1 0 1 0 2 0V3a1 1 0 0 0-1-1" />
            </svg>
        </span>
    </label>


</body>
</html>
