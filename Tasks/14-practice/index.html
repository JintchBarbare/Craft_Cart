<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>14-practice</title>
</head>

<body>
    <button id="count-btn">დააჭირე (0)</button>
    <button id="reset-btn">განულება</button>

    <input type="password" id="pass-input">
    <button id="toggle-pass-btn">ჩვენება</button>
    
    <form id="login-form">
        <input type="email" id="login-email" placeholder="ელფოსტა">
        <input type="password" id="login-password" placeholder="პაროლი">
        <button type="submit">შესვლა</button>
    </form>
    <p id="login-message"></p>
    
    <script type="module" src="js/app.js"></script>
</body>
</html>
